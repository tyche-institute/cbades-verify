[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cbades-verify"
version = "0.1.0"
description = "Research verifier for CB-AdES (ETSI TS 119 152-1) baseline B-B signatures"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Anton Sokolov" }]
requires-python = ">=3.10"
dependencies = [
    "cbor2>=6.1.1,<7",
    "cryptography>=42",
]
keywords = ["CB-AdES", "COSE", "CBOR", "electronic signature", "EN 319 102-1", "X.509"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pycose>=1.1", "asn1crypto>=1.5"]

[project.scripts]
cbades-verify = "cbades_verify.cli:main"

[tool.setuptools]
packages = ["cbades_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]
